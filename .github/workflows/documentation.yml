# Documentation Sphinx : construite à chaque PR qui la touche, publiée sur GitHub Pages à chaque poussée sur master.
name: documentation

on:
  pull_request:
    paths:
      - "documentation/**"
      - ".github/workflows/documentation.yml"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois ; une publication en cours n'est jamais interrompue.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - run: pip install -r documentation/requirements.txt
      # -W : un avertissement (lien cassé, page orpheline) fait échouer la construction.
      - run: sphinx-build -W --keep-going -b html documentation documentation/_build/html
      - if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/_build/html

  publier:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
