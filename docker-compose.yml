# Plateforme ADBI — lancement complet en une commande.
#
#   cp .env.example .env   # puis renseigner les valeurs obligatoires (voir plus bas)
#   docker compose up -d --build
#   → Factory sur http://localhost:4000
#
# PostgreSQL est provisionné ci-dessous (une base par service, voir
# infra/postgres/init-databases.sh). contrats (issue #14), cv-parser (issue
# #15) et one-pager (issue #16) CONSOMMENT désormais leur base — DATABASE_URL
# requise, plus de repli SQLite/JSON pour ces trois services. Les noms de
# service ci-dessous (contrats, one-pager, coffre, cv-parser) sont ceux que
# factory/modules.docker.json utilise comme "hote" — ne pas les renommer sans
# adapter ce fichier également.
services:
  postgres:
    image: postgres:17-alpine
    container_name: adbi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example) — jamais de mot de passe par défaut sur une base de données}
      POSTGRES_DB: ${POSTGRES_USER:-adbi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adbi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port publié vers l'hôte par défaut : seuls les services du réseau
    # compose y accèdent. Pour un accès direct (psql, débogage), décommenter :
    # ports:
    #   - "127.0.0.1:5432:5432"
    restart: unless-stopped
    # Issue #138 : sans plafond mémoire, un service applicatif qui fuit ou
    # explose en mémoire (voir cv-parser ci-dessous) peut affamer tout l'hôte
    # et faire tomber postgres via l'OOM killer du noyau — au pire moment
    # (écriture en cours). Postgres est ici la VICTIME potentielle, pas la
    # source du risque : plafond volontairement généreux plutôt qu'ajusté au
    # plus juste, pour ne jamais le faire tuer par manque de marge légitime
    # (cache partagé, connexions concurrentes des 3 services qui l'utilisent).
    deploy:
      resources:
        limits:
          memory: 1g

  factory:
    build: ./factory
    container_name: adbi-factory
    ports:
      - "4000:4000"
    environment:
      ADBI_LLM_BASE_URL: ${ADBI_LLM_BASE_URL:-}
      ADBI_LLM_API_KEY: ${ADBI_LLM_API_KEY:-}
      ADBI_LLM_MODELS: ${ADBI_LLM_MODELS:-}
    depends_on:
      - contrats
      - one-pager
      - coffre
      - cv-parser
    restart: unless-stopped
    # Issue #138 : aucun des 5 services n'avait de plafond ressources — voir
    # le commentaire sur `postgres` ci-dessus pour le risque. factory ne fait
    # que relayer/agréger, empreinte mémoire modeste attendue.
    deploy:
      resources:
        limits:
          memory: 512m

  contrats:
    build: ./contrats
    container_name: adbi-contrats
    ports:
      - "4100:4100"
    volumes:
      - ./contrats/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4100
      # Requise (issue #14, PR B) — contrats/server.js refuse de démarrer sans
      # elle depuis cette version.
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_contrats
      # Sans code d'accès explicite, un code par défaut connu de tout le
      # dépôt serait écrit dans data/code-parametres.txt — voir ARCHITECTURE.md.
      ADBI_CODE_PARAMETRES: ${ADBI_CODE_PARAMETRES:?ADBI_CODE_PARAMETRES est requis (voir .env.example) — jamais le défaut de développement en déploiement}
      PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
      INSEE_API_KEY: ${INSEE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      YOUSIGN_API_KEY: ${YOUSIGN_API_KEY:-}
      YOUSIGN_MODE: ${YOUSIGN_MODE:-sandbox}
      YOUSIGN_WEBHOOK_SECRET: ${YOUSIGN_WEBHOOK_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_REGION: ${ZOHO_REGION:-eu}
    restart: unless-stopped
    # Issue #138 : voir le commentaire sur `postgres` ci-dessus.
    deploy:
      resources:
        limits:
          memory: 512m

  one-pager:
    build: ./one-pager
    container_name: adbi-onepager
    ports:
      - "4200:4200"
    volumes:
      - ./one-pager/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4200
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_one_pager
    restart: unless-stopped
    # Issue #138 : voir le commentaire sur `postgres` ci-dessus.
    deploy:
      resources:
        limits:
          memory: 512m

  coffre:
    build: ./coffre
    container_name: adbi-coffre
    ports:
      - "4300:4300"
    volumes:
      # data/cle-locale.bin vit ici — SA PERTE REND IRRÉCUPÉRABLES tous les
      # documents "protégés" émis (voir coffre/README.md). Sauvegarder ce
      # volume comme n'importe quelle donnée applicative critique.
      - ./coffre/data:/app/data
    environment:
      ADBI_COFFRE_PORT: 4300
    restart: unless-stopped
    # Issue #138 : voir le commentaire sur `postgres` ci-dessus.
    deploy:
      resources:
        limits:
          memory: 512m

  cv-parser:
    build: ./cv-parser
    container_name: adbi-cv-parser
    ports:
      - "5000:5000"
    volumes:
      - ./cv-parser/data:/app/data
      - ./cv-parser/uploads:/app/uploads
      - ./cv-parser/cv_output:/app/cv_output
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      # Posé ICI, en dur — jamais via une variable .env optionnelle — pour
      # qu'exposer ce service via compose n'oublie jamais l'authentification
      # (voir factory/README.md § Authentification du CV Parser).
      ADBI_AUTH: "on"
      # Requise : cv-parser n'a plus de repli SQLite/JSON (issue #15, PR B).
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_cv_parser
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      ADBI_SUPERUSER_EMAIL: ${ADBI_SUPERUSER_EMAIL:?ADBI_SUPERUSER_EMAIL est requis (voir .env.example) — jamais admin@adbi.fr en déploiement}
      ADBI_SUPERUSER_PASSWORD: ${ADBI_SUPERUSER_PASSWORD:?ADBI_SUPERUSER_PASSWORD est requis (voir .env.example) — jamais le défaut de développement en déploiement}
      ADBI_LLM_BASE_URL: ${ADBI_LLM_BASE_URL:-}
      ADBI_LLM_API_KEY: ${ADBI_LLM_API_KEY:-}
      ADBI_LLM_MODEL: ${ADBI_LLM_MODEL:-}
      ADBI_LLM_MODELS: ${ADBI_LLM_MODELS:-}
    restart: unless-stopped
    # Issue #138 : ce service concentre le vrai risque. Un seul worker
    # Gunicorn, `threads = 4` (voir gunicorn.conf.py) partageant le même
    # process — jusqu'à 4 analyses Docling/torch concurrentes (modèles de
    # mise en page + OCR, chargés une fois en mémoire du process) sur des
    # PDF de 20 Mo chacun (MAX_CONTENT_LENGTH, app.py). Sans plafond, un pic
    # mémoire ici (PDF pathologique, rafale de dépôts) n'est pas contenu au
    # conteneur : il peut affamer l'hôte entier et faire tuer par l'OOM
    # killer n'importe quel autre conteneur (postgres en premier lieu),
    # au lieu de faire échouer proprement la seule analyse en cause.
    # Valeur volontairement large et NON validée contre un vrai pic Docling
    # en production — c'est le point de réglage de l'exploitant si besoin
    # (voir issue #138) : à surveiller, pas à réduire à l'aveugle.
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  postgres-data:
