# Production deployment: runtime secrets only; no published host ports.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example) — jamais de mot de passe par défaut sur une base de données}
      POSTGRES_DB: ${POSTGRES_USER:-adbi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adbi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  factory:
    # additional_contexts (Compose >= 2.17) : expose auth/ (bibliotheque de
    # verification des jetons, #247) au Dockerfile via `COPY --from=auth`,
    # sans la dupliquer dans factory/. Meme mecanisme que le pont DocIE chez
    # contrats.
    build:
      context: ./factory
      additional_contexts:
        auth: ./auth
    environment:
      ADBI_ONEPAGER_URL: ${ADBI_ONEPAGER_URL:?Set the public OnePager HTTPS URL}
      ADBI_CONTRATS_URL: ${ADBI_CONTRATS_URL:?Set the public Contrats HTTPS URL}
      ADBI_COFFRE_URL: ${ADBI_COFFRE_URL:?Set the public Coffre HTTPS URL}
      ADBI_PARSER_URL: ${ADBI_PARSER_URL:?Set the public Parser HTTPS URL}
      # Controle d'acces du hub (#245). ADBI_AUTH absent/off -> passage libre
      # sous l'identite locale, comportement actuel inchange. Pose a "on", le
      # hub exige une session emise par cv-parser et VERIFIEE ici avec le meme
      # secret -- factory n'emet jamais de jeton.
      ADBI_AUTH: ${ADBI_AUTH:-}
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      # URL publique du hub : sert de `next` a la page de connexion de
      # cv-parser, qui la valide contre sa propre ADBI_FACTORY_URL (#254).
      ADBI_FACTORY_URL: ${ADBI_FACTORY_URL:-}
      ADBI_LLM_BASE_URL: ${DOCIE_CHAT_BASE_URL:?Set the DocIE OpenAI-compatible base URL ending in /v1}
      ADBI_LLM_API_KEY: ${DOCIE_API_KEY:?Set the DocIE application access key}
      ADBI_LLM_MODELS: ${DOCIE_CHAT_MODEL:-lfm2.5-2.6b}
    depends_on:
      - contrats
      - one-pager
      - coffre
      - cv-parser
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  contrats:
    # additional_contexts (Compose >= 2.17, cf. `docker compose version`) :
    # expose document-parsing/bridge/ (bridge DocIE partagé, hors du contexte
    # ./contrats) au Dockerfile via `COPY --from=bridge` — sans dupliquer ce
    # fichier partagé dans contrats/ (issue #153, extraction Kbis optionnelle
    # derrière DOCIE_EXTRACTION_ENABLED, voir contrats/lib/docie-extraction.js).
    build:
      context: ./contrats
      additional_contexts:
        bridge: ./document-parsing/bridge
        # Schémas dynamiques partagés (issue #170) : la DÉFINITION du schéma
        # urssaf voyage dans le corps de la requête DocIE, ce fichier doit donc
        # être dans l'image. Voir contrats/Dockerfile, étape 4.
        schemas: ./document-parsing/schemas
        # Table de mois partagée (#179 A10) : lib/kbis-mapping.js et
        # lib/docie-contract-import.js lisent fixtures/date_mission.json pour
        # les dates écrites en toutes lettres. Voir contrats/Dockerfile, étape 5.
        fixtures: ./document-parsing/fixtures
        # Catalogue des modèles par action (#194), lu à l'exécution pour les
        # sélecteurs de modèle. Voir contrats/Dockerfile, étape 6.
        modeles: ./document-parsing/models
    volumes:
      - contrats-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_contrats
      ADBI_CODE_PARAMETRES: ${ADBI_CODE_PARAMETRES:?ADBI_CODE_PARAMETRES est requis (voir .env.example) — jamais le défaut de développement en déploiement}
      PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
      # Extraction Kbis et URSSAF via le bridge DocIE — désactivée par défaut
      # (comportement local pdf-parse/tesseract.js inchangé). Deux voies : Kbis
      # par agent (DOCIE_AGENT_KBIS ci-dessous), URSSAF par la voie texte, qui
      # n'a AUCUN agent à configurer — voir contrats/lib/docie-extraction.js.
      # Variable racine dédiée (CONTRATS_...) : les autres migrations DocIE
      # (cv-parser #151, one-pager #152) ont chacune la leur, pour activer un
      # service à la fois sans basculer les autres involontairement.
      DOCIE_EXTRACTION_ENABLED: ${CONTRATS_DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:-}
      DOCIE_API_KEY: ${DOCIE_API_KEY:-}
      DOCIE_AGENT_KBIS: ${DOCIE_AGENT_KBIS:-}
      # Pré-remplissage de l'import de contrat depuis un PDF — voir
      # contrats/lib/docie-contract-import.js. Même piège que #164
      # (#164 : DOCIE_ALLOW_HTTP manquait côté one-pager) : une variable listée
      # dans contrats/.env.example sans sa ligne ici n'atteint jamais le conteneur.
      DOCIE_AGENT_CONTRACT: ${DOCIE_AGENT_CONTRACT:-}
      # Identifiants réels des modèles du catalogue (#194, voie texte,
      # `store:<nom>`) : un modèle vide n'est pas proposé ; tous vides =
      # contrat par DOCIE_AGENT_CONTRACT et URSSAF inchangés.
      DOCIE_MODELE_NUEXTRACT3: ${DOCIE_MODELE_NUEXTRACT3:-}
      DOCIE_MODELE_LFM25_2_6B: ${DOCIE_MODELE_LFM25_2_6B:-}
      DOCIE_MODELE_LFM25_350M: ${DOCIE_MODELE_LFM25_350M:-}
      # Kbis photo ou scan avec un modèle choisi (#194, vision) : agent DocIE de
      # NuExtract3 pour le schéma kbis. Vide = non proposé ; Kbis sans choix
      # toujours par DOCIE_AGENT_KBIS. Même piège que #164 sans cette ligne.
      DOCIE_AGENT_KBIS_NUEXTRACT3: ${DOCIE_AGENT_KBIS_NUEXTRACT3:-}
      # Le bridge refuse toute DOCIE_BASE_URL en http:// hors localhost sans
      # DOCIE_ALLOW_HTTP=true (document-parsing/bridge/docie-bridge.js). Absente
      # d'ici, elle n'atteignait jamais le conteneur : sur un DocIE en http
      # privé, Kbis, URSSAF ET l'import de contrat échouaient tous en
      # « configuration » avant le moindre appel. Même piège que #164.
      DOCIE_ALLOW_HTTP: ${DOCIE_ALLOW_HTTP:-}
      DOCIE_TIMEOUT_SECONDS: ${DOCIE_TIMEOUT_SECONDS:-360}
      # Modèles HORS ADBI (#194, #217), proposés dans le sélecteur UNIQUEMENT si
      # OPENAI_API_KEY est renseignée — clé vide = comportement d'avant à
      # l'octet près. Le texte du document quitte alors la plateforme : choix
      # explicite de l'utilisateur, jamais un défaut ni un repli. Même piège que
      # #164 : documentées dans contrats/.env.example, ces variables
      # n'atteindraient jamais le conteneur sans ces lignes.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODELE_RAPIDE: ${OPENAI_MODELE_RAPIDE:-}
      OPENAI_MODELE_RAISONNEMENT: ${OPENAI_MODELE_RAISONNEMENT:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-}
      # Pré-remplissages DocIE simultanés (#196), à aligner sur le `n_parallel`
      # du modèle servi pour les contrats (#194). Vide -> défaut du service : 1
      # (NuExtract3). Variable racine dédiée (CONTRATS_...) : chaque service a
      # son modèle, donc son plafond. Même piège que #164 : sans cette ligne,
      # contrats/.env.example documenterait une variable jamais transmise.
      ADBI_EXTRACTION_MAX_CONCURRENT: ${CONTRATS_EXTRACTION_MAX_CONCURRENT:-}
      INSEE_API_KEY: ${INSEE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      YOUSIGN_API_KEY: ${YOUSIGN_API_KEY:-}
      YOUSIGN_MODE: ${YOUSIGN_MODE:-sandbox}
      YOUSIGN_WEBHOOK_SECRET: ${YOUSIGN_WEBHOOK_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_REGION: ${ZOHO_REGION:-eu}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  one-pager:
    # Contexte a la racine (issue #152) : l'image embarque aussi le client
    # bridge DocIE partage (document-parsing/bridge/docie-bridge.js, issue
    # #150), hors de one-pager/ — voir one-pager/Dockerfile.
    build:
      context: .
      dockerfile: one-pager/Dockerfile
    volumes:
      - onepager-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4200
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_one_pager
      # Bascule progressive vers le bridge DocIE partage (issue #152) — voir
      # one-pager/.env.example. Desactive tant que DOCIE_EXTRACTION_ENABLED
      # n'est pas explicitement mis a "true" : aucun changement de comportement
      # par defaut. Les trois variables suivantes ne sont lues que si le
      # drapeau est actif.
      DOCIE_EXTRACTION_ENABLED: ${ONEPAGER_DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:-}
      DOCIE_API_KEY: ${DOCIE_API_KEY:-}
      DOCIE_AGENT_RESUME: ${DOCIE_AGENT_RESUME:-}
      # Modeles proposes a l'import de CV (#194, document-parsing/models/) :
      # identifiants reels, voie texte (store:<nom>) et voie fichier (agent).
      # Vide = modele non propose ; selecteur affiche a partir de deux.
      DOCIE_MODELE_LFM25_2_6B: ${DOCIE_MODELE_LFM25_2_6B:-}
      DOCIE_MODELE_NUEXTRACT3: ${DOCIE_MODELE_NUEXTRACT3:-}
      DOCIE_AGENT_RESUME_LFM25_2_6B: ${DOCIE_AGENT_RESUME_LFM25_2_6B:-}
      DOCIE_AGENT_RESUME_NUEXTRACT3: ${DOCIE_AGENT_RESUME_NUEXTRACT3:-}
      DOCIE_TIMEOUT_SECONDS: ${DOCIE_TIMEOUT_SECONDS:-360}
      # Le bridge refuse HTTP hors loopback par defaut ; derogation explicite
      # pour un reseau prive de confiance seulement (meme var que cv-parser).
      DOCIE_ALLOW_HTTP: ${DOCIE_ALLOW_HTTP:-}
      # Extractions DocIE simultanees (#196), a aligner sur le `n_parallel` du
      # modele servi pour les CV (#194). Vide -> defaut du service : 2
      # (LFM2.5-2.6B). Variable racine dediee (ONEPAGER_...), voir contrats.
      ADBI_EXTRACTION_MAX_CONCURRENT: ${ONEPAGER_EXTRACTION_MAX_CONCURRENT:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  coffre:
    build: ./coffre
    volumes:
      - coffre-data:/app/data
    environment:
      ADBI_COFFRE_PORT: 4300
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  cv-parser:
    build:
      context: ./cv-parser
      additional_contexts:
        # Bridge DocIE partagé (issue #151, #150/#155) : source unique dans
        # document-parsing/bridge/, copiée dans l'image au build (Dockerfile).
        bridge: ./document-parsing/bridge
        # Table de synonymes de compétences partagée (#177 G/H) : `COPY
        # --from=fixtures` sans condition, lue au démarrage. Voir cv-parser/Dockerfile.
        fixtures: ./document-parsing/fixtures
        # Catalogue des modèles par action (#194) : `COPY --from=modeles` sans
        # condition, lu pour le choix du modèle. Voir cv-parser/Dockerfile.
        modeles: ./document-parsing/models
    volumes:
      - parser-data:/app/data
      - parser-uploads:/app/uploads
      - parser-output:/app/cv_output
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:?Set the DocIE API root URL}
      DOCIE_EXTRACTION_MODE: inline
      DOCIE_API_KEY: ${DOCIE_API_KEY:?Set the DocIE application access key}
      DOCIE_SCHEMA_NAME: ${DOCIE_SCHEMA_NAME:-resume}
      DOCIE_MODEL_PROFILE: ${DOCIE_MODEL_PROFILE:-lfm2.5-2.6b}
      DOCIE_OCR_BACKEND: ${DOCIE_OCR_BACKEND:-}
      DOCIE_TIMEOUT_SECONDS: ${DOCIE_TIMEOUT_SECONDS:-360}
      # Bascule issue #151 : off par défaut, docie_client.py (ci-dessus) reste
      # le chemin d'extraction. DOCIE_AGENT_RESUME n'est requis que si activée
      # (nom de l'agent DocIE côté bridge, voir document-parsing/bridge/README.md).
      # Variable racine dédiée (CVPARSER_...) : les autres migrations DocIE
      # (one-pager #152, contrats #153) ont chacune la leur, pour activer un
      # service à la fois sans basculer les autres involontairement.
      DOCIE_EXTRACTION_ENABLED: ${CVPARSER_DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_AGENT_RESUME: ${DOCIE_AGENT_RESUME:-}
      # Modèles proposés au dépôt et à la ré-analyse de CV (#194,
      # document-parsing/models/) : identifiants réels, voie texte (store:<nom>)
      # et voie agent. Vide = modèle non proposé ; sélecteur à partir de deux.
      DOCIE_MODELE_LFM25_2_6B: ${DOCIE_MODELE_LFM25_2_6B:-}
      DOCIE_MODELE_NUEXTRACT3: ${DOCIE_MODELE_NUEXTRACT3:-}
      DOCIE_AGENT_RESUME_LFM25_2_6B: ${DOCIE_AGENT_RESUME_LFM25_2_6B:-}
      DOCIE_AGENT_RESUME_NUEXTRACT3: ${DOCIE_AGENT_RESUME_NUEXTRACT3:-}
      # Analyses DocIE simultanées, dépôts et ré-analyses (#196), à aligner sur
      # le `n_parallel` du modèle servi pour les CV (#194). Vide -> défaut du
      # service : 2 (LFM2.5-2.6B). Variable racine dédiée (CVPARSER_...), voir
      # contrats. Remplace ADBI_UPLOAD_MAX_CONCURRENT, jamais transmis jusqu'ici.
      ADBI_EXTRACTION_MAX_CONCURRENT: ${CVPARSER_EXTRACTION_MAX_CONCURRENT:-}
      # Le bridge refuse HTTP hors loopback par défaut (docie_bridge.py) ;
      # dérogation explicite pour un réseau privé de confiance seulement.
      DOCIE_ALLOW_HTTP: ${DOCIE_ALLOW_HTTP:-}
      ADBI_AUTH: "on"
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_cv_parser
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      ADBI_SUPERUSER_EMAIL: ${ADBI_SUPERUSER_EMAIL:?ADBI_SUPERUSER_EMAIL est requis (voir .env.example) — jamais admin@adbi.fr en déploiement}
      ADBI_SUPERUSER_PASSWORD: ${ADBI_SUPERUSER_PASSWORD:?ADBI_SUPERUSER_PASSWORD est requis (voir .env.example) — jamais le défaut de développement en déploiement}
      ADBI_LLM_BASE_URL: ${DOCIE_CHAT_BASE_URL:?Set the DocIE OpenAI-compatible base URL ending in /v1}
      ADBI_LLM_API_KEY: ${DOCIE_API_KEY:?Set the DocIE application access key}
      ADBI_LLM_MODEL: ${DOCIE_CHAT_MODEL:-lfm2.5-2.6b}
      ADBI_LLM_MODELS: ${DOCIE_CHAT_MODEL:-lfm2.5-2.6b}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  postgres-data:


  contrats-data:
  onepager-data:
  coffre-data:
  parser-data:
  parser-uploads:
  parser-output:
