# =====================================================================
#  ADBI - Generateur de contrats  --  Lancement en une commande
#
#    docker compose up -d --build        (demarrer)
#    docker compose down                 (arreter)
#
#  Puis ouvrir :  http://localhost:4100
#
#  DATABASE_URL est REQUISE (voir lib/schema.sql / lib/db.pg.js, issue #14) :
#  ce compose ne provisionne PAS de PostgreSQL lui-meme, il suppose une base
#  deja joignable (typiquement celle demarree par le docker-compose.yml
#  RACINE du depot, qui lance postgres + tous les services ADBI ensemble —
#  a preferer a ce fichier pour un lancement complet). Pour un lancement
#  isole de ce seul service, exporter DATABASE_URL avant `docker compose up`.
# =====================================================================
services:
  adbi-contrats:
    build: .
    image: adbi-contrats:latest
    container_name: adbi-contrats
    ports:
      - "4100:4100"          # host:conteneur  (changez le 1er nombre pour un autre port local)
    volumes:
      - ./data:/app/data     # referentiel, cle API et fichiers generes conserves sur la machine hote
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est requise (connexion PostgreSQL, voir README.md)}
    restart: unless-stopped
    # Issue #138 : même plafond que le service `contrats` du docker-compose.yml
    # RACINE — sans lui, un pic mémoire ici n'est pas contenu au conteneur et
    # peut affamer l'hôte entier (voir ce fichier pour le détail du risque).
    deploy:
      resources:
        limits:
          memory: 512m
