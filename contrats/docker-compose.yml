# =====================================================================
#  ADBI - Generateur de contrats  --  Lancement en une commande
#
#    docker compose up -d --build        (demarrer)
#    docker compose down                 (arreter)
#
#  Puis ouvrir :  http://localhost:4100
#
#  DATABASE_URL est REQUISE (voir lib/schema.sql / lib/db.pg.js, issue #14) :
#  ce compose ne provisionne PAS de PostgreSQL lui-meme, il suppose une base
#  deja joignable (typiquement celle demarree par le docker-compose.yml
#  RACINE du depot, qui lance postgres + tous les services ADBI ensemble —
#  a preferer a ce fichier pour un lancement complet). Pour un lancement
#  isole de ce seul service, exporter DATABASE_URL avant `docker compose up`.
# =====================================================================
services:
  adbi-contrats:
    # additional_contexts (Compose >= 2.17) : expose ../document-parsing/bridge/
    # (bridge DocIE partagé, hors du dossier contrats/) au Dockerfile via
    # `COPY --from=bridge`, sans le dupliquer dans ce module (issue #153 —
    # extraction Kbis optionnelle, voir lib/docie-extraction.js). Lancé
    # isolément (ce fichier vit dans contrats/), le contexte relatif est donc
    # "../document-parsing/bridge", pas "./document-parsing/bridge" comme dans
    # le docker-compose.yml racine.
    build:
      context: .
      additional_contexts:
        bridge: ../document-parsing/bridge
    image: adbi-contrats:latest
    container_name: adbi-contrats
    ports:
      - "4100:4100"          # host:conteneur  (changez le 1er nombre pour un autre port local)
    volumes:
      - ./data:/app/data     # referentiel, cle API et fichiers generes conserves sur la machine hote
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est requise (connexion PostgreSQL, voir README.md)}
      # Extraction Kbis via le bridge DocIE — désactivée par défaut (comportement
      # local pdf-parse/tesseract.js inchangé). Voir lib/docie-extraction.js.
      DOCIE_EXTRACTION_ENABLED: ${DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:-}
      DOCIE_API_KEY: ${DOCIE_API_KEY:-}
      DOCIE_AGENT_KBIS: ${DOCIE_AGENT_KBIS:-}
      # Pré-remplissage de l'import de contrat depuis un PDF — voir
      # lib/docie-contract-import.js. Même piège que #164 (DOCIE_ALLOW_HTTP
      # documenté mais absent d'ici) : une variable listée dans .env.example
      # sans sa ligne ici n'atteint jamais le conteneur.
      DOCIE_AGENT_CONTRACT: ${DOCIE_AGENT_CONTRACT:-}
    restart: unless-stopped
    # Issue #138 : même plafond que le service `contrats` du docker-compose.yml
    # RACINE — sans lui, un pic mémoire ici n'est pas contenu au conteneur et
    # peut affamer l'hôte entier (voir ce fichier pour le détail du risque).
    deploy:
      resources:
        limits:
          memory: 512m
