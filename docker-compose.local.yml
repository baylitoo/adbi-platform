# Plateforme ADBI — lancement complet en une commande.
#
#   cp .env.example .env   # puis renseigner les valeurs obligatoires (voir plus bas)
#   docker compose up -d --build
#   → Factory sur http://localhost:4000
#
# PostgreSQL est provisionné ci-dessous (une base par service, voir
# infra/postgres/init-databases.sh). contrats (issue #14), cv-parser (issue
# #15) et one-pager (issue #16) CONSOMMENT désormais leur base — DATABASE_URL
# requise, plus de repli SQLite/JSON pour ces trois services. Les noms de
# service ci-dessous (contrats, one-pager, coffre, cv-parser) sont ceux que
# factory/modules.docker.json utilise comme "hote" — ne pas les renommer sans
# adapter ce fichier également.
services:
  postgres:
    image: postgres:17-alpine
    container_name: adbi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example) — jamais de mot de passe par défaut sur une base de données}
      POSTGRES_DB: ${POSTGRES_USER:-adbi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adbi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port publié vers l'hôte par défaut : seuls les services du réseau
    # compose y accèdent. Pour un accès direct (psql, débogage), décommenter :
    # ports:
    #   - "127.0.0.1:5432:5432"
    restart: unless-stopped
    # Limite conservée pour les imports et exports concurrents.
    # Les modèles et l'OCR sont désormais hébergés par DocIE.
    deploy:
      resources:
        limits:
          memory: 1g

  factory:
    # additional_contexts (Compose >= 2.17) : expose auth/ (bibliotheque de
    # verification des jetons, #247) au Dockerfile via `COPY --from=auth`.
    # SANS ce contexte, BuildKit cherche une image « auth » sur Docker Hub et
    # le build echoue ici — alors que le compose racine, lui, fonctionne. Un
    # service bati par DEUX fichiers doit declarer le contexte dans les deux ;
    # le test factory/tests/garde-acces.test.js les lit tous les deux.
    build:
      context: ./factory
      additional_contexts:
        auth: ./auth
    container_name: adbi-factory
    ports:
      - "4000:4000"
    # modules.docker.json (image par défaut) pointe les cartes du hub vers le
    # domaine de production outils.adbi.fr — inatteignable en local. On monte
    # modules.local.json (mêmes 'hote'/'port' internes, 'url' en localhost:port
    # sur les ports publiés ci-dessus) par-dessus /app/modules.json. Sans effet
    # sur docker-compose.yml (Coolify) : celui-ci route déjà via les variables
    # ADBI_ONEPAGER_URL / ADBI_CONTRATS_URL / ADBI_COFFRE_URL / ADBI_PARSER_URL,
    # lues par factory/server.js (chargerModules) et prioritaires sur le
    # 'url' statique de modules.json — voir docker-compose.yml et .env.example.
    volumes:
      - ./factory/modules.local.json:/app/modules.json:ro
    environment:
      ADBI_LLM_BASE_URL: ${ADBI_LLM_BASE_URL:-}
      ADBI_LLM_API_KEY: ${ADBI_LLM_API_KEY:-}
      ADBI_LLM_MODELS: ${ADBI_LLM_MODELS:-}
      # Controle d'acces du hub (#245). Absent/off -> passage libre sous
      # l'identite locale, comportement inchange. Pose a "on", le hub exige une
      # session emise par cv-parser et VERIFIEE ici — il n'en emet aucune.
      ADBI_AUTH: ${ADBI_AUTH:-}
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      # URL publique du hub, `next` de la page de connexion de cv-parser, qui
      # la valide contre sa propre ADBI_FACTORY_URL (#254). Ici : localhost:4000.
      ADBI_FACTORY_URL: ${ADBI_FACTORY_URL:-}
    depends_on:
      - contrats
      - one-pager
      - coffre
      - cv-parser
    restart: unless-stopped
    # Issue #138 : aucun des 5 services n'avait de plafond ressources — voir
    # le commentaire sur `postgres` ci-dessus pour le risque. factory ne fait
    # que relayer/agréger, empreinte mémoire modeste attendue.
    deploy:
      resources:
        limits:
          memory: 512m

  contrats:
    # additional_contexts (Compose >= 2.17) : expose document-parsing/bridge/
    # (bridge DocIE partagé) au Dockerfile via `COPY --from=bridge`, sans le
    # dupliquer dans contrats/ (issue #153 — extraction Kbis optionnelle,
    # voir contrats/lib/docie-extraction.js).
    build:
      context: ./contrats
      additional_contexts:
        bridge: ./document-parsing/bridge
        # Schémas dynamiques partagés (issue #170) : contrats/Dockerfile fait
        # `COPY --from=schemas` sans condition — sans ce contexte, BuildKit
        # cherche une image « schemas » sur Docker Hub et le build échoue.
        schemas: ./document-parsing/schemas
        # Table de mois partagée (#179 A10), même piège : `COPY --from=fixtures`
        # sans condition. Voir contrats/Dockerfile, étape 5.
        fixtures: ./document-parsing/fixtures
        # Catalogue des modèles par action (#194), même piège :
        # `COPY --from=modeles` sans condition. Voir contrats/Dockerfile, étape 6.
        modeles: ./document-parsing/models
        # Bibliothèque de vérification des jetons ADBI (#247), même piège :
        # `COPY --from=auth` sans condition. Voir contrats/Dockerfile, étape 7.
        auth: ./auth
    container_name: adbi-contrats
    ports:
      - "4100:4100"
    volumes:
      - ./contrats/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4100
      # Requise (issue #14, PR B) — contrats/server.js refuse de démarrer sans
      # elle depuis cette version.
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_contrats
      # Sans code d'accès explicite, un code par défaut connu de tout le
      # dépôt serait écrit dans data/code-parametres.txt — voir ARCHITECTURE.md.
      ADBI_CODE_PARAMETRES: ${ADBI_CODE_PARAMETRES:?ADBI_CODE_PARAMETRES est requis (voir .env.example) — jamais le défaut de développement en déploiement}
      # Contrôle d'accès du SERVICE (#245) — distinct d'ADBI_CODE_PARAMETRES
      # ci-dessus, qui ne verrouille que l'écran Paramètres. Absent/off ->
      # passage libre sous l'identité locale, comportement inchangé.
      ADBI_AUTH: ${ADBI_AUTH:-}
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      # URL publique du hub (ici : http://localhost:4000 en général).
      ADBI_FACTORY_URL: ${ADBI_FACTORY_URL:-}
      PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
      # Extraction Kbis via le bridge DocIE — désactivée par défaut (comportement
      # local pdf-parse/tesseract.js inchangé). Voir contrats/lib/docie-extraction.js.
      # Variable racine dédiée (CONTRATS_...), voir docker-compose.yml.
      DOCIE_EXTRACTION_ENABLED: ${CONTRATS_DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:-}
      DOCIE_API_KEY: ${DOCIE_API_KEY:-}
      DOCIE_AGENT_KBIS: ${DOCIE_AGENT_KBIS:-}
      # Pré-remplissage de l'import de contrat depuis un PDF — voir
      # contrats/lib/docie-contract-import.js. Même piège que #164
      # (#164 : DOCIE_ALLOW_HTTP manquait côté one-pager) : une variable listée
      # dans contrats/.env.example sans sa ligne ici n'atteint jamais le conteneur.
      DOCIE_AGENT_CONTRACT: ${DOCIE_AGENT_CONTRACT:-}
      # Identifiants réels des modèles du catalogue (#194), voir docker-compose.yml.
      DOCIE_MODELE_NUEXTRACT3: ${DOCIE_MODELE_NUEXTRACT3:-}
      DOCIE_MODELE_LFM25_2_6B: ${DOCIE_MODELE_LFM25_2_6B:-}
      DOCIE_MODELE_LFM25_350M: ${DOCIE_MODELE_LFM25_350M:-}
      # Kbis photo ou scan, modèle choisi (#194), voir docker-compose.yml.
      DOCIE_AGENT_KBIS_NUEXTRACT3: ${DOCIE_AGENT_KBIS_NUEXTRACT3:-}
      # Le bridge refuse toute DOCIE_BASE_URL en http:// hors localhost sans
      # DOCIE_ALLOW_HTTP=true (document-parsing/bridge/docie-bridge.js). Absente
      # d'ici, elle n'atteignait jamais le conteneur : sur un DocIE en http
      # privé, Kbis, URSSAF ET l'import de contrat échouaient tous en
      # « configuration » avant le moindre appel. Même piège que #164.
      DOCIE_ALLOW_HTTP: ${DOCIE_ALLOW_HTTP:-}
      DOCIE_TIMEOUT_SECONDS: ${DOCIE_TIMEOUT_SECONDS:-900}
      # Modèles HORS ADBI (#194, #217), proposés dans le sélecteur UNIQUEMENT si
      # OPENAI_API_KEY est renseignée — clé vide = comportement d'avant à
      # l'octet près. Le texte du document quitte alors la plateforme : choix
      # explicite de l'utilisateur, jamais un défaut ni un repli. Même piège que
      # #164 : documentées dans contrats/.env.example, ces variables
      # n'atteindraient jamais le conteneur sans ces lignes.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODELE_RAPIDE: ${OPENAI_MODELE_RAPIDE:-}
      OPENAI_MODELE_RAISONNEMENT: ${OPENAI_MODELE_RAISONNEMENT:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-}
      # Pré-remplissages DocIE simultanés (#196), à aligner sur le `n_parallel`
      # du modèle servi pour les contrats (#194). Vide -> défaut du service : 1
      # (NuExtract3). Variable racine dédiée (CONTRATS_...), voir docker-compose.yml.
      ADBI_EXTRACTION_MAX_CONCURRENT: ${CONTRATS_EXTRACTION_MAX_CONCURRENT:-}
      INSEE_API_KEY: ${INSEE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      YOUSIGN_API_KEY: ${YOUSIGN_API_KEY:-}
      YOUSIGN_MODE: ${YOUSIGN_MODE:-sandbox}
      YOUSIGN_WEBHOOK_SECRET: ${YOUSIGN_WEBHOOK_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_REGION: ${ZOHO_REGION:-eu}
    restart: unless-stopped
    # Issue #138 : voir le commentaire sur `postgres` ci-dessus.
    deploy:
      resources:
        limits:
          memory: 512m

  one-pager:
    # Contexte a la racine (issue #152) : l'image embarque aussi le client
    # bridge DocIE partage (document-parsing/bridge/docie-bridge.js, issue
    # #150), hors de one-pager/ — voir one-pager/Dockerfile.
    build:
      context: .
      dockerfile: one-pager/Dockerfile
    container_name: adbi-onepager
    ports:
      - "4200:4200"
    volumes:
      - ./one-pager/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4200
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_one_pager
      # Bascule progressive vers le bridge DocIE partage (issue #152) — voir
      # one-pager/.env.example. Desactive tant que ONEPAGER_DOCIE_EXTRACTION_ENABLED
      # n'est pas explicitement mis a "true" : aucun changement de comportement
      # par defaut. Les trois variables suivantes ne sont lues que si le
      # drapeau est actif.
      DOCIE_EXTRACTION_ENABLED: ${ONEPAGER_DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:-}
      DOCIE_API_KEY: ${DOCIE_API_KEY:-}
      DOCIE_AGENT_RESUME: ${DOCIE_AGENT_RESUME:-}
      # Modeles proposes a l'import de CV (#194), voir docker-compose.yml.
      DOCIE_MODELE_LFM25_2_6B: ${DOCIE_MODELE_LFM25_2_6B:-}
      DOCIE_MODELE_NUEXTRACT3: ${DOCIE_MODELE_NUEXTRACT3:-}
      DOCIE_AGENT_RESUME_LFM25_2_6B: ${DOCIE_AGENT_RESUME_LFM25_2_6B:-}
      DOCIE_AGENT_RESUME_NUEXTRACT3: ${DOCIE_AGENT_RESUME_NUEXTRACT3:-}
      DOCIE_TIMEOUT_SECONDS: ${DOCIE_TIMEOUT_SECONDS:-900}
      # Le bridge refuse HTTP hors loopback par defaut ; derogation explicite
      # pour un reseau prive de confiance seulement (meme var que cv-parser).
      DOCIE_ALLOW_HTTP: ${DOCIE_ALLOW_HTTP:-}
      # Extractions DocIE simultanees (#196), a aligner sur le `n_parallel` du
      # modele servi pour les CV (#194). Vide -> defaut du service : 2
      # (LFM2.5-2.6B). Variable racine dediee (ONEPAGER_...), voir docker-compose.yml.
      ADBI_EXTRACTION_MAX_CONCURRENT: ${ONEPAGER_EXTRACTION_MAX_CONCURRENT:-}
    restart: unless-stopped
    # Issue #138 : voir le commentaire sur `postgres` ci-dessus.
    deploy:
      resources:
        limits:
          memory: 512m

  coffre:
    # additional_contexts (Compose >= 2.17) : expose auth/ (bibliotheque de
    # verification des jetons, #247) au Dockerfile via `COPY --from=auth`.
    # SANS ce contexte, BuildKit cherche une image « auth » sur Docker Hub et
    # le build echoue ici — alors que le compose racine, lui, fonctionne. Un
    # service bati par DEUX fichiers doit declarer le contexte dans les deux ;
    # le test coffre/tests/garde-acces.test.js les lit tous les deux.
    build:
      context: ./coffre
      additional_contexts:
        auth: ./auth
    container_name: adbi-coffre
    ports:
      - "4300:4300"
    volumes:
      # data/cle-locale.bin vit ici — SA PERTE REND IRRÉCUPÉRABLES tous les
      # documents "protégés" émis (voir coffre/README.md). Sauvegarder ce
      # volume comme n'importe quelle donnée applicative critique.
      - ./coffre/data:/app/data
    environment:
      ADBI_COFFRE_PORT: 4300
      # Controle d'acces du coffre (#245). Absent/off -> passage libre sous
      # l'identite locale, comportement inchange. Pose a "on", le coffre exige
      # une session emise par cv-parser et VERIFIEE ici — il n'en emet aucune.
      ADBI_AUTH: ${ADBI_AUTH:-}
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      # URL publique du hub (ici : http://localhost:4000 en general). Le coffre
      # est affiche en <iframe> : un visiteur sans session y est renvoye au
      # NIVEAU SUPERIEUR. Vide -> 401 en clair.
      ADBI_FACTORY_URL: ${ADBI_FACTORY_URL:-}
    restart: unless-stopped
    # Issue #138 : voir le commentaire sur `postgres` ci-dessus.
    deploy:
      resources:
        limits:
          memory: 512m

  cv-parser:
    build:
      context: ./cv-parser
      additional_contexts:
        # Bridge DocIE partagé (issue #151, #150/#155) : source unique dans
        # document-parsing/bridge/, copiée dans l'image au build (Dockerfile).
        bridge: ./document-parsing/bridge
        # Table de synonymes de compétences partagée (#177 G/H) : `COPY
        # --from=fixtures` sans condition, lue au démarrage. Voir cv-parser/Dockerfile.
        fixtures: ./document-parsing/fixtures
        # Catalogue des modèles par action (#194) : `COPY --from=modeles` sans
        # condition, lu pour le choix du modèle. Voir cv-parser/Dockerfile.
        modeles: ./document-parsing/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: adbi-cv-parser
    ports:
      - "5000:5000"
    volumes:
      - ./cv-parser/data:/app/data
      - ./cv-parser/uploads:/app/uploads
      - ./cv-parser/cv_output:/app/cv_output
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DOCIE_BASE_URL: ${DOCIE_BASE_URL:-}
      DOCIE_EXTRACTION_MODE: ${DOCIE_EXTRACTION_MODE:-inline}
      DOCIE_API_KEY: ${DOCIE_API_KEY:-}
      DOCIE_SCHEMA_NAME: ${DOCIE_SCHEMA_NAME:-resume}
      DOCIE_MODEL_PROFILE: ${DOCIE_MODEL_PROFILE:-}
      DOCIE_OCR_BACKEND: ${DOCIE_OCR_BACKEND:-}
      DOCIE_TIMEOUT_SECONDS: ${DOCIE_TIMEOUT_SECONDS:-900}
      # Bascule issue #151 : off par défaut, docie_client.py (ci-dessus) reste
      # le chemin d'extraction. DOCIE_AGENT_RESUME n'est requis que si activée
      # (nom de l'agent DocIE côté bridge, voir document-parsing/bridge/README.md).
      # Variable racine dédiée (CVPARSER_...), voir docker-compose.yml.
      DOCIE_EXTRACTION_ENABLED: ${CVPARSER_DOCIE_EXTRACTION_ENABLED:-false}
      DOCIE_AGENT_RESUME: ${DOCIE_AGENT_RESUME:-}
      # Modèles proposés au dépôt et à la ré-analyse de CV (#194), voir docker-compose.yml.
      DOCIE_MODELE_LFM25_2_6B: ${DOCIE_MODELE_LFM25_2_6B:-}
      DOCIE_MODELE_NUEXTRACT3: ${DOCIE_MODELE_NUEXTRACT3:-}
      DOCIE_AGENT_RESUME_LFM25_2_6B: ${DOCIE_AGENT_RESUME_LFM25_2_6B:-}
      DOCIE_AGENT_RESUME_NUEXTRACT3: ${DOCIE_AGENT_RESUME_NUEXTRACT3:-}
      # Analyses DocIE simultanées, dépôts et ré-analyses (#196), à aligner sur
      # le `n_parallel` du modèle servi pour les CV (#194). Vide -> défaut du
      # service : 2 (LFM2.5-2.6B). Variable racine dédiée (CVPARSER_...), voir
      # docker-compose.yml.
      ADBI_EXTRACTION_MAX_CONCURRENT: ${CVPARSER_EXTRACTION_MAX_CONCURRENT:-}
      # Le bridge refuse HTTP hors loopback par défaut (docie_bridge.py) ;
      # dérogation explicite pour un réseau privé de confiance seulement.
      # host.docker.internal (ci-dessus) n'est pas loopback vu du conteneur :
      # nécessaire ici en local si DOCIE_EXTRACTION_ENABLED=true.
      DOCIE_ALLOW_HTTP: ${DOCIE_ALLOW_HTTP:-}
      # Posé ICI, en dur — jamais via une variable .env optionnelle — pour
      # qu'exposer ce service via compose n'oublie jamais l'authentification
      # (voir factory/README.md § Authentification du CV Parser).
      ADBI_AUTH: "on"
      # Requise : cv-parser n'a plus de repli SQLite/JSON (issue #15, PR B).
      DATABASE_URL: postgresql://${POSTGRES_USER:-adbi}:${POSTGRES_PASSWORD}@postgres:5432/adbi_cv_parser
      ADBI_JWT_SECRET: ${ADBI_JWT_SECRET:?ADBI_JWT_SECRET est requis (voir .env.example)}
      ADBI_SUPERUSER_EMAIL: ${ADBI_SUPERUSER_EMAIL:?ADBI_SUPERUSER_EMAIL est requis (voir .env.example) — jamais admin@adbi.fr en déploiement}
      ADBI_SUPERUSER_PASSWORD: ${ADBI_SUPERUSER_PASSWORD:?ADBI_SUPERUSER_PASSWORD est requis (voir .env.example) — jamais le défaut de développement en déploiement}
      # Portée du cookie de session (#254) — voir docker-compose.yml pour le
      # détail. Sans cette ligne le cookie reste « host-only » et les services
      # Node ne voient aucune session. En local, laisser vide convient : tout
      # est sur localhost, donc host-only suffit.
      ADBI_COOKIE_DOMAIN: ${ADBI_COOKIE_DOMAIN:-}
      # URL publique du hub, pour valider le `next` de /login par origine
      # exacte (#254). Ici : http://localhost:4000 en général.
      ADBI_FACTORY_URL: ${ADBI_FACTORY_URL:-}
      ADBI_LLM_BASE_URL: ${ADBI_LLM_BASE_URL:-}
      ADBI_LLM_API_KEY: ${ADBI_LLM_API_KEY:-}
      ADBI_LLM_MODEL: ${ADBI_LLM_MODEL:-}
      ADBI_LLM_MODELS: ${ADBI_LLM_MODELS:-}
    restart: unless-stopped
    # Issue #138 : ce service concentre le vrai risque. Un seul worker
    # Gunicorn, `threads = 4` (voir gunicorn.conf.py) partageant le même
    # process — jusqu'à 4 analyses Docling/torch concurrentes (modèles de
    # mise en page + OCR, chargés une fois en mémoire du process) sur des
    # PDF de 20 Mo chacun (MAX_CONTENT_LENGTH, app.py). Sans plafond, un pic
    # mémoire ici (PDF pathologique, rafale de dépôts) n'est pas contenu au
    # conteneur : il peut affamer l'hôte entier et faire tuer par l'OOM
    # killer n'importe quel autre conteneur (postgres en premier lieu),
    # au lieu de faire échouer proprement la seule analyse en cause.
    # Valeur volontairement large et NON validée contre un vrai pic Docling
    # en production — c'est le point de réglage de l'exploitant si besoin
    # (voir issue #138) : à surveiller, pas à réduire à l'aveugle.
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  postgres-data:
